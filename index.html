:root{
  --navy:#0f172a;
  --surface:#f8fafc;
  --card:#ffffff;
  --ink:#0f172a;
  --muted:#475569;
  --yellow:#facc15;
  --red:#ef4444;
  --teal:#2dd4bf;
  --line:#dbe4ef
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--navy);
  color:var(--ink);
  font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

a{
  color:inherit
}

button{
  font:inherit
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top,0px);
  background:var(--navy)
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top,0px);
  z-index:20;
  height:68px;
  background:rgba(15,23,42,.97);
  border-bottom:1px solid #263451;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(16px,4vw,44px)
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  text-decoration:none;
  font-weight:700;
  letter-spacing:-.02em;
  white-space:nowrap
}

.brand strong{
  color:var(--yellow)
}

.mini-grid{
  display:grid;
  grid-template-columns:repeat(5,4px);
  gap:2px
}

.mini-grid i{
  width:4px;
  height:4px;
  border-radius:50%;
  background:#334155
}

.mini-grid i.on{
  background:var(--yellow);
  box-shadow:0 0 6px var(--yellow)
}

.topbar nav{
  display:flex;
  gap:24px
}

.topbar nav a{
  color:#cbd5e1;
  text-decoration:none;
  font-size:14px
}

.topbar nav a:hover{
  color:#fff
}

.nav-cta{
  background:var(--yellow);
  color:#111827;
  border-radius:999px;
  padding:9px 14px;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:6px
}

.hero{
  max-width:1280px;
  margin:0 auto;
  padding:clamp(38px,6vw,76px) clamp(16px,4vw,44px);
  color:#fff;
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:48px;
  align-items:center
}

.eyebrow{
  color:var(--yellow);
  font-size:12px;
  letter-spacing:.18em;
  font-weight:700;
  margin:0 0 18px
}

.kicker{
  color:#0f766e;
  font-size:12px;
  letter-spacing:.18em;
  font-weight:700;
  margin:0 0 10px
}

h1{
  font-size:clamp(52px,8vw,96px);
  line-height:.86;
  letter-spacing:-.06em;
  margin:0
}

h1 span{
  color:var(--yellow)
}

.sub{
  font-size:clamp(17px,2vw,21px);
  line-height:1.55;
  color:#cbd5e1;
  max-width:650px
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  margin:28px 0
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  cursor:pointer
}

.btn.yellow{
  background:var(--yellow);
  color:#111
}

.btn.white{
  background:#fff;
  color:#111
}

.btn.teal{
  background:var(--teal);
  color:#082f2b
}

.copy-note{
  color:#a7f3d0;
  font-size:14px
}

.stats{
  display:flex;
  flex-wrap:wrap;
  border-top:1px solid #334155;
  padding-top:20px;
  gap:18px
}

.stats span{
  color:#94a3b8;
  font-size:13px
}

.stats b{
  color:#fff;
  font-size:17px;
  margin-right:4px
}

.hero-board{
  background:#fff;
  color:#111;
  border-radius:24px;
  padding:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
  transform:rotate(1deg)
}

.board-head{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:.14em;
  font-weight:700
}

.live-dot{
  width:9px;
  height:9px;
  background:#22c55e;
  border-radius:50%;
  display:inline-block;
  margin:0 4px
}

.led-grid{
  width:min(100%,230px);
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  background:#020617;
  border-radius:20px;
  padding:22px;
  margin:20px auto
}

.led-grid span{
  border-radius:50%;
  background:#17203a
}

.led-grid span.lit{
  background:var(--yellow);
  box-shadow:0 0 16px var(--yellow)
}

.led-grid span.lit.red{
  background:var(--red);
  box-shadow:0 0 16px var(--red)
}

.board-buttons{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 15px
}

.board-buttons span{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e2e8f0;
  display:grid;
  place-items:center;
  font-weight:800
}

.board-buttons .logo{
  background:var(--yellow);
  font-size:24px
}

.hero-board p{
  text-align:center;
  color:#64748b;
  line-height:1.5;
  margin:18px 0 0
}

.hero-board p strong{
  color:#111
}

.section{
  max-width:1280px;
  margin:0 auto;
  padding:42px clamp(16px,4vw,44px)
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:30px;
  margin-bottom:24px
}

.section-head h2,.start-intro h2,.code-head h2,.lesson-head h2,.rubric-intro h2,.check-card h2,.help-card h2{
  font-size:clamp(32px,4vw,48px);
  line-height:1.02;
  letter-spacing:-.04em;
  margin:0
}

.section-head p{
  color:var(--muted);
  max-width:380px;
  line-height:1.6
}

.control-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.control-card{
  background:var(--card);
  border-radius:16px;
  padding:20px;
  min-height:168px;
  position:relative;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
  border-top:4px solid var(--yellow)
}

.control-card:nth-child(3n){
  border-top-color:var(--red)
}

.control-card:nth-child(3n+2){
  border-top-color:var(--teal)
}

.key{
  display:inline-block;
  background:#0f172a;
  color:#fff;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700
}

.control-card h3{
  margin:18px 0 6px;
  font-size:18px
}

.control-card p{
  color:var(--muted);
  line-height:1.5;
  margin:0;
  font-size:14px
}

.control-card small{
  position:absolute;
  right:16px;
  top:18px;
  color:#94a3b8
}

.start-section{
  background:#fff;
  border-radius:24px;
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:36px;
  align-items:center;
  margin-top:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.18)
}

.start-intro>p:not(.kicker){
  color:var(--muted);
  line-height:1.6
}

.warn{
  background:#fffbeb;
  border:1px solid #fde68a;
  border-radius:12px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:3px;
  margin-top:20px
}

.warn strong{
  color:#92400e
}

.warn span{
  color:#78350f;
  font-size:14px
}

.steps{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  gap:10px
}

.steps li{
  display:flex;
  gap:14px;
  padding:16px;
  border-radius:14px;
  background:#f8fafc
}

.steps li>span{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:50%;
  background:var(--navy);
  color:var(--yellow);
  display:grid;
  place-items:center;
  font-weight:800
}

.steps h3{
  margin:0 0 3px
}

.steps p{
  margin:0;
  color:var(--muted);
  line-height:1.5
}

.code-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  color:#fff;
  margin-bottom:20px
}

.code-head p{
  color:#94a3b8
}

.code-head button{
  background:var(--yellow);
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:800;
  display:flex;
  gap:8px;
  align-items:center;
  cursor:pointer
}

.code-wrap{
  overflow:hidden;
  border-radius:16px;
  border:1px solid #334155;
  background:#020617;
  box-shadow:0 18px 45px rgba(0,0,0,.25)
}

.code-bar{
  display:flex;
  gap:7px;
  align-items:center;
  padding:12px 14px;
  border-bottom:1px solid #1e293b
}

.code-bar span{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#ef4444
}

.code-bar span:nth-child(2){
  background:var(--yellow)
}

.code-bar span:nth-child(3){
  background:#22c55e
}

.code-bar b{
  color:#e2e8f0;
  font-size:13px;
  margin-left:8px
}

.code-bar em{
  color:#64748b;
  font-style:normal;
  font-size:12px;
  margin-left:auto
}

.code-wrap pre{
  margin:0;
  max-height:560px;
  overflow:auto;
  padding:20px;
  color:#e2e8f0;
  font:13px/1.65 "IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  white-space:pre;
  overflow-wrap:anywhere
}

.progress-box{
  background:#fff;
  border-radius:16px;
  padding:18px;
  min-width:280px;
  box-shadow:0 8px 24px rgba(15,23,42,.08)
}

.progress-box>div:first-child{
  display:flex;
  justify-content:space-between;
  gap:20px
}

.progress-box strong{
  font-size:20px
}

.progress-box span{
  color:#64748b;
  font-size:13px
}

.bar{
  height:8px;
  background:#e2e8f0;
  border-radius:99px;
  margin:12px 0 6px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:var(--teal);
  transition:width .25s
}

.progress-actions{
  display:flex;
  gap:15px;
  margin-top:12px
}

.progress-actions button{
  border:0;
  background:none;
  color:#0f766e;
  font-weight:700;
  cursor:pointer;
  padding:0
}

.lessons{
  display:grid;
  gap:12px
}

.lesson{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
  border-left:6px solid var(--accent)
}

.lesson-top{
  width:100%;
  border:0;
  background:transparent;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:18px;
  cursor:pointer;
  text-align:left
}

.lesson-num{
  font-size:34px;
  font-weight:800;
  color:#cbd5e1;
  letter-spacing:-.06em
}

.lesson-title{
  display:flex;
  gap:12px;
  align-items:center;
  flex:1
}

.lesson-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:color-mix(in srgb,var(--accent) 18%,white);
  color:#0f172a;
  display:grid;
  place-items:center
}

.lesson-title small{
  display:block;
  color:#94a3b8;
  font-size:10px;
  letter-spacing:.15em
}

.lesson-title strong{
  font-size:21px
}

.try{
  text-align:right
}

.try small{
  display:block;
  color:#94a3b8;
  font-size:10px
}

.try b{
  font-size:13px
}

.rot{
  transform:rotate(180deg)
}

.lesson-body{
  padding:0 20px 20px 74px
}

.lesson-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:14px
}

.lesson-meta>div{
  background:#f8fafc;
  border-radius:12px;
  padding:14px
}

.lesson-meta span,.starter-box>span,.custom-box>span{
  font-size:11px;
  letter-spacing:.12em;
  font-weight:800;
  color:#64748b
}

.lesson-meta p{
  margin:6px 0 0;
  font-weight:600
}

.lesson-cols{
  display:grid;
  grid-template-columns:.75fr 1.25fr;
  gap:14px
}

.starter-box{
  background:#fffbeb;
  border-radius:12px;
  padding:16px
}

.starter-box p{
  line-height:1.55
}

.custom-box{
  background:#f0fdfa;
  border:1px solid #ccfbf1;
  border-radius:12px;
  padding:16px
}

.custom-box ul{
  list-style:none;
  margin:12px 0 0;
  padding:0;
  display:grid;
  gap:9px
}

.custom-box label{
  display:flex;
  gap:9px;
  align-items:flex-start;
  cursor:pointer;
  line-height:1.45
}

.custom-box input{
  position:absolute;
  opacity:0;
  pointer-events:none
}

.box{
  width:20px;
  height:20px;
  flex:0 0 20px;
  border:2px solid #0f766e;
  border-radius:5px;
  display:grid;
  place-items:center;
  background:#fff;
  color:#0f766e
}

.custom-box label:has(input:checked) span:last-child{
  text-decoration:line-through;
  color:#64748b
}

.test{
  margin-top:14px;
  background:#0f172a;
  color:#fff;
  border-radius:10px;
  padding:13px 15px;
  display:flex;
  gap:10px;
  align-items:center;
  line-height:1.5
}

.test strong{
  color:var(--yellow)
}

.rubric-section{
  background:#fff;
  border-radius:24px;
  margin-top:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.18)
}

.rubric-intro{
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end;
  margin-bottom:22px
}

.rubric-intro p{
  color:var(--muted)
}

.rubric-legend{
  display:flex;
  gap:16px
}

.rubric-legend span{
  background:#f8fafc;
  border-radius:10px;
  padding:10px 12px;
  font-size:13px
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px
}

.table-wrap table{
  width:100%;
  border-collapse:collapse;
  min-width:620px
}

.table-wrap th{
  background:#0f172a;
  color:#fff;
  text-align:left;
  padding:13px 15px;
  font-size:13px
}

.table-wrap th span{
  color:var(--yellow)
}

.table-wrap td{
  padding:12px 15px;
  border-top:1px solid #e2e8f0
}

.total-row td{
  background:#fef9c3;
  font-weight:700
}

.rubric-detail{
  color:#475569;
  line-height:1.6;
  margin:18px 0
}

.grade-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.grade-grid article{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:16px
}

.grade-grid strong{
  color:#0f766e
}

.grade-grid h3{
  margin:6px 0
}

.grade-grid p{
  margin:0;
  color:#64748b;
  line-height:1.5
}

.bottom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}

.check-card,.help-card{
  background:#fff;
  border-radius:20px;
  padding:26px;
  box-shadow:0 8px 24px rgba(15,23,42,.08)
}

.check-card ul{
  list-style:none;
  padding:0;
  margin:22px 0 0;
  display:grid;
  gap:15px
}

.check-card li{
  display:flex;
  gap:10px;
  line-height:1.5;
  color:#334155
}

.check-card li svg{
  color:#0f766e;
  flex:0 0 18px
}

.help-card>div{
  display:grid;
  gap:0;
  margin-top:18px
}

.help-card>div>div{
  padding:15px 0;
  border-top:1px solid #e2e8f0
}

.help-card strong{
  font-size:15px
}

.help-card p{
  margin:4px 0 0;
  color:#64748b;
  line-height:1.5
}

footer{
  max-width:1280px;
  margin:0 auto;
  padding:34px clamp(16px,4vw,44px) 42px;
  color:#cbd5e1;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center
}

.footer-dots{
  display:flex;
  gap:5px;
  margin-bottom:8px
}

.footer-dots i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--yellow)
}

.footer-dots i:nth-child(odd){
  background:var(--teal)
}

footer p{
  margin:0
}

footer a{
  color:#fff;
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none
}

@media(max-width:820px){
  .topbar nav{
    display:none
  }

  .hero{
    grid-template-columns:1fr;
    gap:28px
  }

  .hero-board{
    transform:none
  }

  .control-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .start-section{
    grid-template-columns:1fr
  }

  .section-head,.code-head,.lesson-head,.rubric-intro{
    flex-direction:column;
    align-items:flex-start
  }

  .lesson-body{
    padding-left:20px
  }

  .lesson-cols,.lesson-meta,.bottom-grid,.grade-grid{
    grid-template-columns:1fr
  }

  .try{
    display:none
  }

  .progress-box{
    width:100%
  }

  footer{
    flex-direction:column;
    align-items:flex-start
  }

  .code-bar em{
    display:none
  }
}

@media(max-width:520px){
  .topbar{
    height:auto;
    padding-top:12px;
    padding-bottom:12px
  }

  .brand>span:last-child{
    font-size:14px
  }

  .nav-cta{
    font-size:12px;
    padding:8px 10px
  }

  .control-grid{
    grid-template-columns:1fr
  }

  .control-card{
    min-height:0
  }

  .hero{
    padding-top:28px
  }

  .lesson-top{
    padding:14px
  }

  .lesson-num{
    font-size:26px
  }

  .lesson-title strong{
    font-size:18px
  }

  .section{
    padding-left:14px;
    padding-right:14px
  }

  .stats{
    gap:12px
  }

  .rubric-legend{
    flex-direction:column;
    gap:8px
  }

  .hero-actions .btn{
    width:100%;
    justify-content:center
  }

  .code-wrap pre{
    font-size:12px;
    padding:14px
  }

  .table-wrap table{
    min-width:560px
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#0f172a;
    --card:#16223a;
    --ink:#f8fafc;
    --muted:#b8c2d0;
    --line:#2b3a58
  }

  .section-head p,.start-intro>p:not(.kicker),.control-card p,.steps p,.check-card li,.help-card p{
    color:#cbd5e1
  }

  .control-card,.start-section,.progress-box,.lesson,.rubric-section,.check-card,.help-card,.hero-board{
    background:#16223a;
    color:#f8fafc
  }

  .lesson-meta>div,.steps li,.rubric-legend span,.table-wrap td{
    color:#e2e8f0
  }

  .lesson-meta>div,.steps li,.rubric-legend span{
    background:#0f172a
  }

  .starter-box{
    background:#2c2410
  }

  .custom-box{
    background:#092a2a
  }

  .code-head button,.nav-cta,.btn.yellow{
    color:#111
  }

  .grade-grid article,.help-card>div>div,.table-wrap{
    border-color:#2b3a58
  }

  .table-wrap td{
    border-color:#2b3a58
  }

  .total-row td{
    background:#3a3310;
    color:#fff
  }

  .lesson-icon{
    color:#fff
  }

  .hero-board p strong{
    color:#fff
  }

  .hero-board p{
    color:#b8c2d0
  }

  .board-buttons span{
    background:#2b3a58;
    color:#fff
  }

  .box{
    background:#0f172a
  }
}

@media print{
  body,.app-shell{
    background:#fff!important
  }

  .topbar{
    position:static
  }

  .hero,.section-head,.code-head,.lesson-head,.rubric-intro{
    color:#111
  }

  .hero{
    padding:20px
  }

  .sub,.code-head p{
    color:#444!important
  }

  .control-grid,.grade-grid,.bottom-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .lesson,.control-card,.start-section,.rubric-section,.check-card,.help-card{
    box-shadow:none!important;
    border:1px solid #ccc
  }

  .hero-board{
    display:none
  }

  .btn,.nav-cta,.progress-actions{
    display:none!important
  }

  a{
    color:#111;
    text-decoration:none
  }

  .code-wrap pre{
    max-height:none;
    white-space:pre-wrap
  }
}

py = 2             # sprite y position

NAMES = ["1 Output", "2 Variables", "3 Input", "4 Loops",
         "5 If/Else", "6 Functions", "7 Sensors", "8 Random",
         "9 Radio", "10 Game"]

# ---------- Lesson 6: a reusable function ----------
def draw_bar(level: number):
    """Fill the screen from the bottom up, level 0-5."""
    basic.clear_screen()
    for row in range(level):
        for col in range(5):
            led.plot(col, 4 - row)

# ---------- Menu ----------
def show_menu():
    basic.clear_screen()
    basic.show_number(lesson + 1)

def go(step: number):
    global lesson
    lesson = (lesson + step) % TOTAL
    music.play(music.tone_playable(262 + lesson * 40, music.beat(BeatFraction.EIGHTH)),
               music.PlaybackMode.UNTIL_DONE)
    show_menu()

def on_button_a():
    go(-1)
input.on_button_pressed(Button.A, on_button_a)

def on_button_b():
    go(1)
input.on_button_pressed(Button.B, on_button_b)

# ---------- Demos ----------
def demo_output():
    basic.show_icon(IconNames.HEART)
    basic.pause(400)
    basic.show_icon(IconNames.SMALL_HEART)
    basic.pause(400)
    basic.show_string("HI")
    music.play(music.builtin_playable_sound_effect(soundExpression.twinkle),
               music.PlaybackMode.UNTIL_DONE)

def demo_variables():
    global count
    count += 1
    basic.show_string("N=")
    basic.show_number(count)

def demo_input():
    basic.show_icon(IconNames.SURPRISED)
    basic.show_string("TOUCH")

def demo_loops():
    basic.clear_screen()
    for i in range(5):
        led.plot(i, i)
        basic.pause(150)
    n = 0
    while n < 3:
        basic.clear_screen()
        basic.pause(150)
        for i in range(5):
            led.plot(i, i)
        basic.pause(150)
        n += 1

def demo_ifelse():
    if input.acceleration(Dimension.X) < -300:
        basic.show_arrow(ArrowNames.WEST)
    elif input.acceleration(Dimension.X) > 300:
        basic.show_arrow(ArrowNames.EAST)
    else:
        basic.show_icon(IconNames.YES)

def demo_functions():
    for lvl in range(6):
        draw_bar(lvl)
        basic.pause(200)
    for lvl in range(5, -1, -1):
        draw_bar(lvl)
        basic.pause(200)

def demo_sensors():
    brightness = input.light_level()
    draw_bar(Math.constrain(Math.idiv(brightness, 51), 0, 5))
    basic.pause(1200)
    basic.show_string("T")
    basic.show_number(input.temperature())

def demo_random():
    roll = randint(1, 6)
    basic.show_number(roll)
    if roll == 6:
        music.play(music.builtin_playable_sound_effect(soundExpression.spring),
                   music.PlaybackMode.UNTIL_DONE)

def demo_radio():
    radio.set_group(7)
    radio.send_string("hello")
    basic.show_icon(IconNames.SMALL_DIAMOND)
    basic.pause(300)
    basic.show_icon(IconNames.DIAMOND)

def demo_game():
    global px, score
    score = 0
    px = 2
    for round in range(8):
        dot_x = randint(0, 4)
        for y in range(5):
            basic.clear_screen()
            led.plot(dot_x, y)
            led.plot(px, 4)
            basic.pause(250)
            if input.button_is_pressed(Button.A) and px > 0:
                px -= 1
            if input.button_is_pressed(Button.B) and px < 4:
                px += 1
        if dot_x == px:
            score += 1
            music.play(music.tone_playable(659, music.beat(BeatFraction.SIXTEENTH)),
                       music.PlaybackMode.UNTIL_DONE)
    basic.show_string("SCORE")
    basic.show_number(score)

def run_demo():
    if lesson == 0: demo_output()
    elif lesson == 1: demo_variables()
    elif lesson == 2: demo_input()
    elif lesson == 3: demo_loops()
    elif lesson == 4: demo_ifelse()
    elif lesson == 5: demo_functions()
    elif lesson == 6: demo_sensors()
    elif lesson == 7: demo_random()
    elif lesson == 8: demo_radio()
    else: demo_game()
    basic.pause(500)
    show_menu()

def on_button_ab():
    run_demo()
input.on_button_pressed(Button.AB, on_button_ab)

def on_logo_pressed():
    basic.show_string(NAMES[lesson])
    show_menu()
input.on_logo_event(TouchButtonEvent.PRESSED, on_logo_pressed)

def on_shake():
    basic.show_number(randint(1, 6))
    basic.pause(600)
    show_menu()
input.on_gesture(Gesture.SHAKE, on_shake)

def on_received_string(msg):
    basic.show_icon(IconNames.HAPPY)
    basic.pause(600)
    show_menu()
radio.on_received_string(on_received_string)

radio.set_group(7)
basic.show_string("LAB")
show_menu()

def on_forever():
    if lesson == 6:
        pass
    basic.pause(100)
